# Swarm Shield Enterprise Deployment
# Production-grade Docker Compose configuration with resource constraints,
# secrets management, and enterprise logging configuration.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
#
# Environment variables are loaded from .env file. See .env.example for all options.

version: '3.8'

# =============================================================================
# Secrets
# =============================================================================
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt

# =============================================================================
# Networks
# =============================================================================
networks:
  swarm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.0.0/24
          gateway: 172.28.0.1
  monitoring:
    driver: bridge
    internal: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# =============================================================================
# Services
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Swarm Shield API Gateway
  # ---------------------------------------------------------------------------
  swarm-shield:
    build:
      context: ..
      dockerfile: Dockerfile
      cache_from:
        - swarm-shield:latest
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
    secrets:
      - jwt_secret
      - postgres_password
      - redis_password
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - POSTGRES_ENABLED=${POSTGRES_ENABLED:-true}
      - DATABASE_URL=postgres://swarm:${POSTGRES_PASSWORD:-swarm_password}@postgres:5432/${POSTGRES_DB:-swarm_shield}?sslmode=disable
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-120}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-20}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_ENDPOINT=0.0.0.0
      - METRICS_PATH=/metrics
      - FEATURE_AUDIT_LOG=${FEATURE_AUDIT_LOG:-true}
      - FEATURE_P2P=${FEATURE_P2P:-true}
      - FEATURE_POW=${FEATURE_POW:-true}
      - FEATURE_WEBSOCKET=${FEATURE_WEBSOCKET:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
        labels: "service=swarm-shield,environment=${ENVIRONMENT:-production}"
    networks:
      - swarm-net
      - monitoring
    security_context:
      - no-new-privileges: true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ---------------------------------------------------------------------------
  # Redis Cache & Session Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
    secrets:
      - redis_password
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: host
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    healthcheck:
      test: >
        bash -c 'if [ -n "$REDIS_PASSWORD" ]; then
          redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG;
        else
          redis-cli ping | grep -q PONG;
        fi'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        labels: "service=redis,environment=${ENVIRONMENT:-production}"
    networks:
      - swarm-net
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    security_context:
      - no-new-privileges: true
      - run-as-user: "999"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.3-alpine
    secrets:
      - postgres_password
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-swarm}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-swarm_password}
      - POSTGRES_DB=${POSTGRES_DB:-swarm_shield}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swarm} -d ${POSTGRES_DB:-swarm_shield}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres,environment=${ENVIRONMENT:-production}"
    networks:
      - swarm-net
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /var/run/postgresql:noexec,nosuid,size=64m
    security_context:
      - no-new-privileges: true
      - run-as-user: "70:70"

  # ---------------------------------------------------------------------------
  # Prometheus Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.49.0
    ports:
      - target: 9090
        published: 9091
        protocol: tcp
        mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=prometheus,environment=${ENVIRONMENT:-production}"
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    security_context:
      - no-new-privileges: true
      - run-as-user: "65534:65534"

  # ---------------------------------------------------------------------------
  # Grafana Metrics Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.0
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    entrypoint: ["/bin/bash", "/etc/grafana/grafana-entrypoint.sh"]
    secrets:
      - grafana_password
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      - GF_SERVER_ENFORCE_DOMAIN=false
      - GF_LOG_LEVEL=${GRAFANA_LOG_LEVEL:-warn}
      - GF_LOG_MODE=console
      - GF_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS:-false}
      - GF_AUTH_BASIC_ENABLED=${GRAFANA_AUTH_BASIC:-true}
      - GF_AUTH_LDAP_ENABLED=${GRAFANA_AUTH_LDAP:-false}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/swarm-shield.json
      - GF_INSTALL_PLUGINS=
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_PATHS_LOGS=/var/log/grafana
      - GF_PATHS_DATA=/var/lib/grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-entrypoint.sh:/etc/grafana/grafana-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=grafana,environment=${ENVIRONMENT:-production}"
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
      - /var/log/grafana:noexec,nosuid,size=64m
      - /var/lib/grafana/plugins:noexec,nosuid,size=64m
    security_context:
      - no-new-privileges: true
      - run-as-user: "472:472"
