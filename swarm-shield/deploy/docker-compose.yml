version: '3.8'

services:
  swarm-shield:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - PORT=8080
      - REDIS_ENABLED=true
      - REDIS_ADDR=redis:6379
      - POSTGRES_ENABLED=true
      - DATABASE_URL=postgres://swarm:swarm_password@postgres:5432/swarm_shield?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPM=120
      - RATE_LIMIT_BURST=20
      - METRICS_ENABLED=true
      - FEATURE_AUDIT_LOG=true
      - FEATURE_P2P=true
      - FEATURE_POW=true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - swarm-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - swarm-net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=swarm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-swarm_password}
      - POSTGRES_DB=swarm_shield
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm_shield"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - swarm-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ../deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - swarm-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../deploy/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    networks:
      - swarm-net

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  swarm-net:
    driver: bridge
