apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-shield
  namespace: swarm-shield
  labels:
    app: swarm-shield
spec:
  replicas: 3
  selector:
    matchLabels:
      app: swarm-shield
  template:
    metadata:
      labels:
        app: swarm-shield
    spec:
      containers:
        - name: swarm-shield
          image: swarm-shield:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: swarm-shield-config
            - secretRef:
                name: swarm-shield-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
