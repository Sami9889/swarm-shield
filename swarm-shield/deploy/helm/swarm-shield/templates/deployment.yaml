apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swarm-shield.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swarm-shield.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "swarm-shield.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swarm-shield.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "swarm-shield.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "swarm-shield.fullname" . }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default (include "swarm-shield.fullname" .) }}
          env:
            - name: JWT_SECRET_FILE
              value: "/run/secrets/$(JWT_SECRET)"
            - name: POSTGRES_PASSWORD_FILE
              value: "/run/secrets/$(POSTGRES_PASSWORD)"
            - name: REDIS_PASSWORD_FILE
              value: "/run/secrets/$(REDIS_PASSWORD)"
            - name: GF_SECURITY_ADMIN_PASSWORD_FILE
              value: "/run/secrets/$(GF_SECURITY_ADMIN_PASSWORD)"
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ .Values.secrets.existingSecret | default (include "swarm-shield.fullname" .) }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
