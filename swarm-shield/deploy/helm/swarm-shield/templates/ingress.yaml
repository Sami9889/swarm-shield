apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swarm-shield
  namespace: swarm-shield
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.swarm-shield.example.com
      secretName: swarm-shield-tls
  rules:
    - host: api.swarm-shield.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swarm-shield
                port:
                  number: 8080
